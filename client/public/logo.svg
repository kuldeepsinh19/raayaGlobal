<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="white"/>

  <!-- Globe base circle -->
  <circle cx="200" cy="155" r="90" fill="#1B3A6B"/>

  <!-- Ocean/land highlights on globe -->
  <ellipse cx="175" cy="130" rx="28" ry="38" fill="#2A5298" opacity="0.7"/>
  <ellipse cx="215" cy="120" rx="20" ry="25" fill="#2A5298" opacity="0.6"/>
  <ellipse cx="200" cy="175" rx="35" ry="22" fill="#2A5298" opacity="0.5"/>
  <ellipse cx="165" cy="170" rx="18" ry="14" fill="#2A5298" opacity="0.4"/>
  <ellipse cx="230" cy="165" rx="22" ry="16" fill="#2A5298" opacity="0.4"/>
  <ellipse cx="185" cy="148" rx="10" ry="8" fill="#3260B0" opacity="0.6"/>
  <ellipse cx="210" cy="145" rx="8" ry="12" fill="#3260B0" opacity="0.5"/>
  <!-- Latitude lines -->
  <ellipse cx="200" cy="155" rx="90" ry="22" fill="none" stroke="#3260B0" stroke-width="1.2" opacity="0.5"/>
  <ellipse cx="200" cy="155" rx="90" ry="50" fill="none" stroke="#3260B0" stroke-width="1" opacity="0.3"/>
  <!-- Longitude line -->
  <ellipse cx="200" cy="155" rx="40" ry="90" fill="none" stroke="#3260B0" stroke-width="1" opacity="0.3"/>
  <!-- Globe clip to circle -->
  <circle cx="200" cy="155" r="90" fill="none" stroke="#1B3A6B" stroke-width="0"/>

  <!-- Gold orbital ring (ellipse) - behind globe bottom part -->
  <ellipse cx="200" cy="165" rx="120" ry="32" fill="none" stroke="#D4A017" stroke-width="9" opacity="0.9"/>

  <!-- Mask top part of ring that should be behind globe -->
  <clipPath id="frontRing">
    <rect x="0" y="165" width="400" height="200"/>
  </clipPath>
  <ellipse cx="200" cy="165" rx="120" ry="32" fill="none" stroke="#E8B422" stroke-width="9" clip-path="url(#frontRing)"/>

  <!-- Arrow head on the ring (right side) -->
  <polygon points="318,155 308,148 304,160" fill="#E8B422"/>

  <!-- Text: Raaya -->
  <text x="200" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="#1B3A6B" text-anchor="middle" letter-spacing="1">Raaya</text>

  <!-- Text: Global Solutions -->
  <text x="200" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#D4A017" text-anchor="middle" letter-spacing="2">Global Solutions</text>
</svg>
